apiVersion: 1
datasources:
  - name: Monitor DB
    uid: monitor-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: monitor
    isDefault: true
    secureJsonData:
      password: $DB_PASSWORD
    jsonData:
      database: monitor
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
