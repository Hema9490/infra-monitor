# One command demo:  docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/monitor
      DB_USER: monitor
      DB_PASSWORD: ${DB_PASSWORD:-monitor}
      MONITOR_API_KEY: ${MONITOR_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      MONITOR_REMEDIATION_ENABLED: "false"   # see docker-compose.remediation.yml
      # For email alerts also set: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Two demo agents to simulate two servers. On real machines run one agent per server.
  agent-1:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      MONITOR_SERVER_URL: http://server:8080
      AGENT_HOST_NAME: app-server-1
      AGENT_INTERVAL_SECONDS: "10"
      AGENT_API_KEY: ${MONITOR_API_KEY:-}
    depends_on:
      server:
        condition: service_healthy

  agent-2:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      MONITOR_SERVER_URL: http://server:8080
      AGENT_HOST_NAME: app-server-2
      AGENT_INTERVAL_SECONDS: "10"
      AGENT_API_KEY: ${MONITOR_API_KEY:-}
    depends_on:
      server:
        condition: service_healthy

  # A target service for the demo: stop it and watch the alert (and optional auto-restart).
  demo-web:
    image: nginx:alpine
    container_name: demo-web
    ports:
      - "8081:80"

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-monitor}   # used by the provisioned datasource
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  grafana-data:
