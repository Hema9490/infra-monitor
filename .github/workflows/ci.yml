name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test both modules
        run: mvn -B verify
      - name: Upload agent jar
        uses: actions/upload-artifact@v4
        with:
          name: infra-monitor-agent
          path: agent/target/infra-monitor-agent.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile -t infra-monitor-server:ci .
      - name: Build agent image
        run: docker build -f agent/Dockerfile -t infra-monitor-agent:ci .
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.remediation.yml config -q
